# Runs the tests and builds the website on every push and pull request.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resume_analyzer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/resume_analyzer_test?schema=public
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-1234567890
      CLIENT_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server packages
        working-directory: server
        run: npm ci

      - name: Prepare the database
        working-directory: server
        run: |
          npx prisma generate
          npx prisma migrate deploy

      - name: Unit tests
        working-directory: server
        run: npm test

      - name: Integration tests
        working-directory: server
        run: npm run test:integration

      - name: Install website packages
        working-directory: client
        run: npm ci

      - name: Build the website
        working-directory: client
        run: npm run build
